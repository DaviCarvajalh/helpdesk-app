name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    env:
      # Solo necesarios para que `next build` pueda ejecutar sus checks
      # (no se conectan a ninguna base de datos real durante el build).
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      JWT_SECRET: "ci-only-secret-not-used-in-production-min-32-chars"
      ENCRYPTION_KEY: "ci-only-32-chars-key-not-real!!!"
      APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (prisma generate + next build)
        run: npm run build

      - name: Validate docker compose config
        run: |
          cp .env.example .env
          docker compose config
